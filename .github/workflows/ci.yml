name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore StockApp.sln

      - name: Build
        run: dotnet build StockApp.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test StockApp.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
